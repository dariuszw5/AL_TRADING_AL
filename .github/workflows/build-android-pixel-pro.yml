name: Build Android Pixel Pro Standalone APK

on:
  push:
    branches:
      - android-pixel-pro-side-by-side-20260915
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Pixel Pro sources
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path

          root = Path('app/frontend/al_trading_dashboard/lib')
          root.mkdir(parents=True, exist_ok=True)

          main_b64 = ''.join(
              Path(f'ci/pixel_main.part{i}').read_text().strip()
              for i in range(1, 5)
          )
          api_b64 = Path('ci/pixel_api.part1').read_text().strip()

          main_bytes = gzip.decompress(base64.b64decode(main_b64))
          api_bytes = gzip.decompress(base64.b64decode(api_b64))

          expected = '83d946cc305460b00de7964614515b881ddac8ab9bdf9f55b9e8d92587fda464'
          actual = hashlib.sha256(main_bytes).hexdigest()
          if actual != expected:
              raise SystemExit(f'Pixel Pro source checksum mismatch: {actual}')

          (root / 'main.dart').write_bytes(main_bytes)
          (root / 'api_client.dart').write_bytes(api_bytes)
          print('Pixel Pro sources restored and verified')
          PY

      - name: Configure Android networking and app label
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/frontend/al_trading_dashboard/android/app/src/main/AndroidManifest.xml')
          text = path.read_text(encoding='utf-8')

          if 'android.permission.INTERNET' not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />',
                  1,
              )

          text = text.replace(
              'android:label="al_trading_dashboard"',
              'android:label="AL Trading Pixel Pro"',
          )
          text = text.replace(
              'android:label="AL Trading"',
              'android:label="AL Trading Pixel Pro"',
          )

          if 'android:usesCleartextTraffic' not in text:
              text = text.replace(
                  '<application\n',
                  '<application\n        android:usesCleartextTraffic="true"\n',
                  1,
              )

          path.write_text(text, encoding='utf-8')

      - name: Get dependencies
        working-directory: app/frontend/al_trading_dashboard
        run: flutter pub get

      - name: Analyze dashboard
        working-directory: app/frontend/al_trading_dashboard
        run: flutter analyze lib/main.dart lib/api_client.dart --no-fatal-infos

      - name: Build APK
        working-directory: app/frontend/al_trading_dashboard
        run: flutter build apk --release --dart-define=API_BASE_URL=http://100.77.193.89:8000

      - name: Prepare artifact
        shell: bash
        run: |
          cp app/frontend/al_trading_dashboard/build/app/outputs/flutter-apk/app-release.apk AL_Trading_Pixel_Pro_Standalone.apk
          sha256sum AL_Trading_Pixel_Pro_Standalone.apk > AL_Trading_Pixel_Pro_Standalone.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AL_Trading_Pixel_Pro_Standalone
          path: |
            AL_Trading_Pixel_Pro_Standalone.apk
            AL_Trading_Pixel_Pro_Standalone.sha256
          retention-days: 14
          if-no-files-found: error
