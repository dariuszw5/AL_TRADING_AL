name: Build Android Pixel Pro APK

on:
  push:
    branches:
      - android-pixel-pro-20260915
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Pixel Pro sources
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          root = Path('app/frontend/al_trading_dashboard/lib')
          root.mkdir(parents=True, exist_ok=True)
          main_data = base64.b64decode(Path('ci/pixel_main.gz.b64').read_text().strip())
          api_data = base64.b64decode(Path('ci/pixel_api.gz.b64').read_text().strip())
          (root / 'main.dart').write_bytes(gzip.decompress(main_data))
          (root / 'api_client.dart').write_bytes(gzip.decompress(api_data))
          PY

      - name: Configure Android networking
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/frontend/al_trading_dashboard/android/app/src/main/AndroidManifest.xml')
          text = path.read_text(encoding='utf-8')
          if 'android.permission.INTERNET' not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />',
                  1,
              )
          text = text.replace('android:label="al_trading_dashboard"', 'android:label="AL Trading"')
          if 'android:usesCleartextTraffic' not in text:
              text = text.replace(
                  '<application\n',
                  '<application\n        android:usesCleartextTraffic="true"\n',
                  1,
              )
          path.write_text(text, encoding='utf-8')

      - name: Get dependencies
        working-directory: app/frontend/al_trading_dashboard
        run: flutter pub get

      - name: Analyze dashboard
        working-directory: app/frontend/al_trading_dashboard
        run: flutter analyze lib/main.dart lib/api_client.dart --no-fatal-infos

      - name: Build APK
        working-directory: app/frontend/al_trading_dashboard
        run: flutter build apk --release --dart-define=API_BASE_URL=http://100.77.193.89:8000

      - name: Prepare artifact
        shell: bash
        run: |
          cp app/frontend/al_trading_dashboard/build/app/outputs/flutter-apk/app-release.apk AL_Trading_Android_Pixel_Pro.apk
          sha256sum AL_Trading_Android_Pixel_Pro.apk > AL_Trading_Android_Pixel_Pro.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AL_Trading_Android_Pixel_Pro
          path: |
            AL_Trading_Android_Pixel_Pro.apk
            AL_Trading_Android_Pixel_Pro.sha256
          retention-days: 14
          if-no-files-found: error
